[package]
name = "openeo-web-editor"
version = "0.15.2"
description = "openEO Web Editor as desktop application"
authors = ["openEO Consortium"]
license = "Apache-2.0"
repository = "https://github.com/Open-EO/openeo-web-editor"
edition = "2021"

[lib]
name = "openeo_web_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-http = { version = "2", features = ["unsafe-headers"] }
tauri-plugin-localhost = "2"
tauri-plugin-opener = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
